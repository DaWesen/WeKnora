apiVersion: weknora.plugin/v1
kind: Plugin
metadata:
  id: com.weknora.retriever-memory
  name: Memory Vector Retriever
  description: In-memory vector retriever with cosine similarity ranking. Index state is process-local and lost on restart.
  version: 0.1.0
spec:
  extensionType: retriever
  weknoraVersion: ">=0.1.0"
  capabilities: [index, vector, embedding]
  entrypoint:
    type: container
    image: weknora/retriever-memory:0.1.0
    command: ["/retriever-plugin"]
    grpcAddress: unix:///tmp/weknora-retriever.sock
    containerGrpcAddress: unix:///tmp/weknora-retriever.sock
  permissions:
    network:
      enabled: false
    filesystem: {}
  healthCheck:
    intervalSeconds: 30
    timeoutSeconds: 10
  restartPolicy:
    enabled: true
    maxAttempts: 3
    windowSeconds: 300
    backoffMillis: 5000
  configSchema:
    type: object
    properties: {}
