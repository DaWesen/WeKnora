apiVersion: weknora.plugin/v1
kind: Plugin
metadata:
  id: com.weknora.parser-markdown-plain
  name: Markdown & Plain Text Parser
  description: Markdown and plain text parser with line-ending normalization, front matter extraction, and heading promotion. Fully offline.
  version: 0.1.0
spec:
  extensionType: document_parser
  weknoraVersion: ">=0.1.0"
  capabilities: [stream]
  entrypoint:
    type: process
    command: ["./document-parser-plugin"]
    grpcAddress: unix:///tmp/weknora-docparser.sock
  permissions:
    network:
      # Process plugins cannot declare network disabled — the host only
      # enforces isolation under a container runtime (see plugin.container.yaml).
      enabled: true
    filesystem: {}
  healthCheck:
    intervalSeconds: 30
    timeoutSeconds: 10
  restartPolicy:
    enabled: true
    maxAttempts: 3
    windowSeconds: 300
    backoffMillis: 5000
  configSchema:
    type: object
    properties: {}
