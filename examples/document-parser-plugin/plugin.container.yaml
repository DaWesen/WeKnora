apiVersion: weknora.plugin/v1
kind: Plugin
metadata:
  id: com.weknora.parser-markdown-plain
  name: Markdown & Plain Text Parser
  description: Markdown and plain text parser with line-ending normalization, front matter extraction, and heading promotion. Fully offline.
  version: 0.1.0
spec:
  extensionType: document_parser
  weknoraVersion: ">=0.1.0"
  capabilities: [stream]
  entrypoint:
    type: container
    image: weknora/parser-markdown-plain:0.1.0
    command: ["/document-parser-plugin"]
    grpcAddress: unix:///tmp/weknora-docparser.sock
    containerGrpcAddress: unix:///tmp/weknora-docparser.sock
  permissions:
    network:
      enabled: false
    filesystem: {}
  healthCheck:
    intervalSeconds: 30
    timeoutSeconds: 10
  restartPolicy:
    enabled: true
    maxAttempts: 3
    windowSeconds: 300
    backoffMillis: 5000
  configSchema:
    type: object
    properties: {}
