apiVersion: weknora.plugin/v1
kind: Plugin
metadata:
  id: com.weknora.local-files
  name: Local Files
  version: 0.1.0
  description: Sync markdown and text files from an explicitly configured directory.
spec:
  extensionType: datasource
  weknoraVersion: ">=0.1.0"
  entrypoint:
    type: process
    command: ["./local-files-plugin"]
    grpcAddress: "127.0.0.1:50071"
  configSchema:
    type: object
    required: [rootPath]
    properties:
      rootPath:
        type: string
      networkProbeTarget:
        type: string
  permissions:
    network:
      enabled: true
    filesystem:
      readOnly: []
  healthCheck:
    intervalSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3
