apiVersion: weknora.plugin/v1
kind: Plugin
metadata:
  id: com.weknora.model-provider-deterministic
  name: Deterministic (Offline) Models
  description: Fully offline deterministic chat, embedding, and rerank models. No API key, no network.
  version: 0.1.0
spec:
  extensionType: model_provider
  weknoraVersion: ">=0.1.0"
  capabilities: [chat, embedding, rerank]
  entrypoint:
    type: process
    command: ["./model-provider-plugin"]
    grpcAddress: unix:///tmp/weknora-model-provider.sock
  permissions:
    network:
      # Process plugins cannot declare network disabled — the host only
      # enforces isolation under a container runtime (see plugin.container.yaml).
      enabled: true
    filesystem: {}
  healthCheck:
    intervalSeconds: 30
    timeoutSeconds: 10
  restartPolicy:
    enabled: true
    maxAttempts: 3
    windowSeconds: 300
    backoffMillis: 5000
  configSchema:
    type: object
    properties: {}
