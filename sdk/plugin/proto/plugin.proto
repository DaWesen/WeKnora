syntax = "proto3";

package weknora.plugin.v1;

option go_package = "github.com/Tencent/WeKnora/sdk/plugin/proto";

service PluginLifecycle {
  rpc GetInfo(GetInfoRequest) returns (PluginInfo);
  rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse);
  rpc ValidateConfig(ValidateConfigRequest) returns (ValidateConfigResponse);
  rpc Shutdown(ShutdownRequest) returns (ShutdownResponse);
}


service DocumentParserPlugin {
  rpc Describe(DocumentParserDescribeRequest) returns (DocumentParserDescribeResponse);
  rpc Parse(DocumentParserParseRequest) returns (DocumentParserParseResponse);
}

service WebSearchPlugin {
  rpc Describe(WebSearchDescribeRequest) returns (WebSearchDescribeResponse);
  rpc Search(WebSearchRequest) returns (WebSearchResponse);
}

service ModelProviderPlugin {
  rpc Describe(ModelProviderDescribeRequest) returns (ModelProviderDescribeResponse);
  rpc ListModels(ListModelsRequest) returns (ListModelsResponse);
}

service RetrieverPlugin {
  rpc Describe(RetrieverDescribeRequest) returns (RetrieverDescribeResponse);
  rpc Retrieve(RetrieveRequest) returns (RetrieveResponse);
}

service DataSourcePlugin {
  rpc ValidateCredentials(ValidateCredentialsRequest) returns (ValidateCredentialsResponse);
  rpc ListResources(ListResourcesRequest) returns (ListResourcesResponse);
  rpc ResolveResourceAncestors(ResolveResourceAncestorsRequest) returns (ResolveResourceAncestorsResponse);
  rpc FetchAll(FetchAllRequest) returns (FetchAllResponse);
  rpc Sync(SyncRequest) returns (stream SyncEvent);
}

message GetInfoRequest {}

message PluginInfo {
  string id = 1;
  string version = 2;
  repeated string extension_types = 3;
}

message HealthCheckRequest {}

message HealthCheckResponse {
  enum Status {
    STATUS_UNSPECIFIED = 0;
    STATUS_SERVING = 1;
    STATUS_NOT_SERVING = 2;
  }
  Status status = 1;
  string message = 2;
}

message ValidateConfigRequest { map<string, string> config = 1; }
message ValidateConfigResponse { bool valid = 1; repeated FieldError errors = 2; }
message FieldError { string field = 1; string message = 2; }
message ShutdownRequest {}
message ShutdownResponse {}
message ValidateCredentialsRequest { map<string, string> config = 1; }
message ValidateCredentialsResponse { bool valid = 1; string message = 2; }
message ListResourcesRequest { map<string, string> config = 1; string parent_id = 2; }
message ListResourcesResponse { repeated Resource resources = 1; }
message ResolveResourceAncestorsRequest { map<string, string> config = 1; repeated string resource_ids = 2; }
message ResolveResourceAncestorsResponse { repeated string ancestor_ids = 1; }
message FetchAllRequest { string datasource_id = 1; map<string, string> config = 2; repeated string resource_ids = 3; }
message FetchAllResponse { repeated Document documents = 1; }

message Resource {
  string external_id = 1;
  string name = 2;
  string type = 3;
  string description = 4;
  string url = 5;
  string modified_at = 6;
  string parent_id = 7;
  bool has_children = 8;
  map<string, string> metadata = 9;
}

message Document {
  string source_id = 1;
  string source_resource_id = 2;
  string name = 3;
  bytes content = 4;
  string content_type = 5;
  string url = 6;
  string updated_at = 7;
  map<string, string> metadata = 8;
  bool is_deleted = 9;
}

message SyncRequest { string datasource_id = 1; map<string, string> config = 2; string cursor = 3; repeated string resource_ids = 4; }
message SyncEvent {
  oneof payload {
    UpsertDocument upsert_document = 1;
    DeleteDocument delete_document = 2;
    Progress progress = 3;
    Checkpoint checkpoint = 4;
    SyncError error = 5;
    Completed completed = 6;
  }
}
message UpsertDocument { string source_id = 1; string name = 2; bytes content = 3; string content_type = 4; map<string, string> metadata = 5; string updated_at = 6; }
message DeleteDocument { string source_id = 1; }
message Progress { uint64 completed = 1; uint64 total = 2; string message = 3; }
message Checkpoint { string cursor = 1; }
message SyncError { string source_id = 1; string message = 2; bool retryable = 3; SyncErrorCode code = 4; string target = 5; }
enum SyncErrorCode { SYNC_ERROR_CODE_UNSPECIFIED = 0; SYNC_ERROR_CODE_SECURITY_POLICY_DENIED = 1; }
message Completed { string cursor = 1; }

message ExtensionConfigField {
  string key = 1;
  string label = 2;
  string type = 3;
  bool required = 4;
  string default_value = 5;
  repeated string options = 6;
}

message DocumentParserDescribeRequest {}
message DocumentParserDescribeResponse {
  string engine_name = 1;
  string description = 2;
  repeated string file_types = 3;
  repeated string capabilities = 4;
}
message DocumentParserParseRequest {
  map<string, string> config = 1;
  bytes file_content = 2;
  string file_name = 3;
  string file_type = 4;
  string url = 5;
  string title = 6;
  string request_id = 7;
}
message DocumentParserParseResponse {
  string markdown_content = 1;
  repeated ParsedImage images = 2;
  map<string, string> metadata = 3;
  string error = 4;
  bool is_audio = 5;
  bytes audio_data = 6;
}
message ParsedImage {
  string filename = 1;
  string original_ref = 2;
  string mime_type = 3;
  string storage_key = 4;
  bytes image_data = 5;
  bool is_original = 6;
}

message WebSearchDescribeRequest {}
message WebSearchDescribeResponse {
  string provider_type = 1;
  string display_name = 2;
  string description = 3;
  bool requires_api_key = 4;
  bool supports_proxy = 5;
  repeated ExtensionConfigField config_fields = 6;
  repeated string capabilities = 7;
}
message WebSearchRequest {
  map<string, string> config = 1;
  string query = 2;
  int32 max_results = 3;
  bool include_date = 4;
}
message WebSearchResponse { repeated WebSearchResult results = 1; }
message WebSearchResult {
  string title = 1;
  string url = 2;
  string snippet = 3;
  string content = 4;
  string source = 5;
  string published_at = 6;
}

message ModelProviderDescribeRequest {}
message ModelProviderDescribeResponse {
  string provider_type = 1;
  string display_name = 2;
  string description = 3;
  repeated string model_types = 4;
  map<string, string> default_urls = 5;
  bool requires_auth = 6;
  repeated ExtensionConfigField config_fields = 7;
  repeated string capabilities = 8;
}
message ListModelsRequest { map<string, string> config = 1; }
message ListModelsResponse { repeated PluginModel models = 1; }
message PluginModel { string id = 1; string name = 2; repeated string capabilities = 3; }

message RetrieverDescribeRequest {}
message RetrieverDescribeResponse {
  string engine_type = 1;
  string description = 2;
  repeated string capabilities = 3;
  repeated string retriever_types = 4;
}
message RetrieveRequest {
  map<string, string> config = 1;
  string query = 2;
  repeated float embedding = 3;
  repeated string knowledge_base_ids = 4;
  repeated string knowledge_ids = 5;
  repeated string tag_ids = 6;
  repeated string exclude_knowledge_ids = 7;
  repeated string exclude_chunk_ids = 8;
  int32 top_k = 9;
  double threshold = 10;
  string knowledge_type = 11;
  string retriever_type = 12;
}
message RetrieveResponse { repeated RetrieveHit results = 1; }
message RetrieveHit {
  string id = 1;
  string content = 2;
  string source_id = 3;
  string source_type = 4;
  string chunk_id = 5;
  string knowledge_id = 6;
  string knowledge_base_id = 7;
  string tag_id = 8;
  double score = 9;
  bool is_enabled = 10;
}