syntax = "proto3";

package weknora.plugin.v1;

option go_package = "github.com/Tencent/WeKnora/internal/plugin/proto";

service PluginLifecycle {
  rpc GetInfo(GetInfoRequest) returns (PluginInfo);
  rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse);
  rpc ValidateConfig(ValidateConfigRequest) returns (ValidateConfigResponse);
  rpc Shutdown(ShutdownRequest) returns (ShutdownResponse);
}

service DataSourcePlugin {
  rpc ValidateCredentials(ValidateCredentialsRequest) returns (ValidateCredentialsResponse);
  rpc ListResources(ListResourcesRequest) returns (ListResourcesResponse);
  rpc ResolveResourceAncestors(ResolveResourceAncestorsRequest) returns (ResolveResourceAncestorsResponse);
  rpc FetchAll(FetchAllRequest) returns (FetchAllResponse);
  rpc Sync(SyncRequest) returns (stream SyncEvent);
}

message GetInfoRequest {}

message PluginInfo {
  string id = 1;
  string version = 2;
  repeated string extension_types = 3;
}

message HealthCheckRequest {}

message HealthCheckResponse {
  enum Status {
    STATUS_UNSPECIFIED = 0;
    STATUS_SERVING = 1;
    STATUS_NOT_SERVING = 2;
  }

  Status status = 1;
  string message = 2;
}

message ValidateConfigRequest {
  map<string, string> config = 1;
}

message ValidateConfigResponse {
  bool valid = 1;
  repeated FieldError errors = 2;
}

message FieldError {
  string field = 1;
  string message = 2;
}

message ShutdownRequest {}
message ShutdownResponse {}

message ValidateCredentialsRequest {
  map<string, string> config = 1;
}

message ValidateCredentialsResponse {
  bool valid = 1;
  string message = 2;
}

message ListResourcesRequest {
  map<string, string> config = 1;
  string parent_id = 2;
}

message ListResourcesResponse {
  repeated Resource resources = 1;
}

message ResolveResourceAncestorsRequest {
  map<string, string> config = 1;
  repeated string resource_ids = 2;
}

message ResolveResourceAncestorsResponse {
  repeated string ancestor_ids = 1;
}

message FetchAllRequest {
  string datasource_id = 1;
  map<string, string> config = 2;
  repeated string resource_ids = 3;
}

message FetchAllResponse {
  repeated Document documents = 1;
}

message Resource {
  string external_id = 1;
  string name = 2;
  string type = 3;
  string description = 4;
  string url = 5;
  string modified_at = 6;
  string parent_id = 7;
  bool has_children = 8;
  map<string, string> metadata = 9;
}

message Document {
  string source_id = 1;
  string source_resource_id = 2;
  string name = 3;
  bytes content = 4;
  string content_type = 5;
  string url = 6;
  string updated_at = 7;
  map<string, string> metadata = 8;
  bool is_deleted = 9;
}

message SyncRequest {
  string datasource_id = 1;
  map<string, string> config = 2;
  string cursor = 3;
  repeated string resource_ids = 4;
}

message SyncEvent {
  oneof payload {
    UpsertDocument upsert_document = 1;
    DeleteDocument delete_document = 2;
    Progress progress = 3;
    Checkpoint checkpoint = 4;
    SyncError error = 5;
    Completed completed = 6;
  }
}

message UpsertDocument {
  string source_id = 1;
  string name = 2;
  bytes content = 3;
  string content_type = 4;
  map<string, string> metadata = 5;
  string updated_at = 6;
}

message DeleteDocument {
  string source_id = 1;
}

message Progress {
  uint64 completed = 1;
  uint64 total = 2;
  string message = 3;
}

message Checkpoint {
  string cursor = 1;
}

message SyncError {
  string source_id = 1;
  string message = 2;
  bool retryable = 3;
  SyncErrorCode code = 4;
  string target = 5;
}

enum SyncErrorCode {
  SYNC_ERROR_CODE_UNSPECIFIED = 0;
  SYNC_ERROR_CODE_SECURITY_POLICY_DENIED = 1;
}

message Completed {
  string cursor = 1;
}
